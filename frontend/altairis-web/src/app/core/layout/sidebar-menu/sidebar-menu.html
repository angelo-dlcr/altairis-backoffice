
<aside class="bg-black p-3 h-100" style="min-width: 250px;">

  <h1 class="text-light text-center">ALTAIRIS</h1>
  <p class="text-secondary text-center w-100 fw-semibold" style="font-size: 0.8em;">BACKOFFICE</p>
  <hr class="bg-secondary w-100 border-0 mt-3" style="height: 3px;">

  <nav class="d-flex flex-column mt-5">
    @for (item of menuItems; track item) {

      <a
        class="btn btn-outline-secondary border-0 mt-2 mb-2 p-3 text-start"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        (click)="selectMenuOption()"
        #rla="routerLinkActive"
        [class.fw-bold]="rla.isActive"
        [class.text-black]="rla.isActive"
        [class.text-bg-]="rla.isActive"
        [class.bg-secondary-subtle]="rla.isActive"
      >
        <i class='{{item.icon}} me-3'></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>
