<div class="d-flex mt-4 align-items-center position-relative">
    <small class="d-flex fw-semibold gap-2 text-secondary pe-3 position-absolute start-0">
        Total: {{totalCount()}} registros
    </small>

    <nav class="w-100 d-flex justify-content-center">
        <ul class="pagination mb-0" style="cursor: pointer;">
            <li 
                class="page-item"
                [class.disabled]="pageNumber() <= 1"
            >
                <a 
                    class="page-link border-0" 
                    aria-label="Fisrt"
                    (click)="firstPage()"
                >
                    <span aria-hidden="true">&laquo;&laquo;</span>
                </a>
            </li>

            <li 
                class="page-item"
                [class.disabled]="pageNumber() <= 1"
            >
                <a 
                    class="page-link border-0" 
                    aria-label="Previous"
                    (click)="previousPage()"
                >
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            @for (page of pagesArray(); track page) {
                <li 
                    class="page-item"
                    [class.active]="pageNumber() === page"
                >
                    <a 
                        class="page-link border-0" 
                        aria-label="Next"  
                        (click)="goToPage(page)"
                    >
                        <span aria-hidden="true">{{page}}</span>
                    </a>
                </li>
            }

            <li 
                class="page-item"
                [class.disabled]="pageNumber() >= totalPages()"
            >
                <a 
                    class="page-link border-0" 
                    aria-label="Next"
                    (click)="nextPage()"
                >
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
            
            <li 
                class="page-item"
                [class.disabled]="pageNumber() >= totalPages()"
            >
                <a 
                    class="page-link border-0" 
                    aria-label="Last"
                    (click)="lastPage()"
                >
                    <span aria-hidden="true">&raquo;&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>

    <small class="d-flex fw-semibold gap-2 text-secondary pe-3 position-absolute end-0">
        Registros por página: {{ pageSize() }}
    </small>
</div>
