<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1200;">
    @for(toast of toastService.toasts(); track toast) {
    <div 
        class="toast show align-items-center border-1 mb-2 rounded-3 overflow-hidden"
        [ngClass]="'text-' + toast.type"
        [ngClass]="'border-' + toast.type"
        role="alert" 
        aria-live="assertive" 
        aria-atomic="true"
    >
        <div 
            class="d-flex flex-column"
            [ngClass]="'text-' + toast.type + ' bg-' + toast.type + '-subtle'"
        >
            <div 
                class="toast-header p-1 ps-3"
                [ngClass]="`text-bg-${toast.type}`"
            >
                @if(toast.title) {
                    <span 
                        class="fw-semibold"
                    > 
                        {{ toast.title }} 
                    </span>
                }
            </div>
            <div class="toast-body w-100 d-flex gap-3 align-items-center">
                <i class="fs-5 fw-bolder bi"
                    [class.bi-info]="['info', 'primary', 'secondary'].includes(toast.type)"
                    [class.bi-check2-circle]="toast.type == 'success'"
                    [class.bi-exclamation-octagon]="toast.type == 'danger'"
                    [class.bi-exclamation-triangle]="toast.type == 'warning'"
                ></i>
                <div 
                    class="fw-semibold fs-6"
                    [ngClass]="'text-' + toast.type + '-emphasis'"
                >
                    {{ toast.message }}
                </div>
                <a 
                    role="button" 
                    class="bi bi-x-lg me-2 m-auto "
                    [ngClass]="'text-' + toast.type"
                    (click)="toastService.remove(toast.id)"
                    aria-label="Close"
                ></a>
            </div>
        </div>
    </div>
    }
</div>
