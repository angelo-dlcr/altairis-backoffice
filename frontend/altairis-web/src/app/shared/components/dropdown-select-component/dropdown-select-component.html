<select
    class="form-control form-select d-none opacity-0"
    [value]="selectedValue ?? null"
    [disabled]="viewing()"
    tabindex="-1"
    aria-hidden="true"
>
    @for (option of options(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
    }
</select>

<div
    class="dropdown form-control p-0"
    [class.is-invalid]="checkInvalid()"
    [class.is-valid]="checkValid()"
    [class.disabled]="viewing()"
>
    <button
        class="btn form-control border-0 w-100 position-relative dropdown-toggle text-end"
        type="button"
        data-bs-toggle="dropdown"
        aria-expanded="false"

        (blur)="markAsTouched()"
        [disabled]="viewing()"
        [style.color]="applyTransparency()"
        [class.bg-secondary-subtle]="viewing()"
        [attr.aria-invalid]="checkInvalid()"
    >
        <span
            class="fw-normal ps-xl-2 text-black w-100 text-start position-absolute end-0"
        >
            {{ getOptionLabel() || placeholder() }}
        </span>
    </button>

    <ul
        class="dropdown-menu w-100"
        style="max-height: 150px; overflow-y: auto;"
    >
        @for (option of options(); track option.value) {
            <li>
                <button
                    class="dropdown-item"
                    type="button"
                    [class.active]="selectedValue === option.value"
                    [attr.aria-label]="option.label"
                    [attr.aria-selected]="selectedValue === option.value"
                    (click)="selectOption(option)"
                >
                    {{ option.label }}
                </button>
            </li>
        }
    </ul>
</div>

@if (checkInvalid()) {
    <div class="invalid-feedback d-block">
        Campo requerido
    </div>
}
