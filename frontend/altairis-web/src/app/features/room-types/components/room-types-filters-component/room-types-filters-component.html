
<div class="container mt-5 mb-4">
    <div class="row mb-3">
        <div class=" col-md-4">
            <label for="" class="form-label fw-semibold">Código / Nombre:</label>
            <input
                type="text"
                class="form-control"
                id="nameOrCode"
                [(ngModel)]="filters().nameOrCode"
                (ngModelChange)="updateFilterField('nameOrCode', $event)"
                placeholder=""
            />
        </div>
        <div class="col-md-4">
            <label for="" class="form-label fw-semibold">Estado</label>
            <app-dropdown-select-component
                id="isActive"
                [options]="statusOptions"
                [value]="filters().isActive"
                (valueChange)="updateFilterField('isActive', $event)"
            />
        </div>
    </div>

    <div class="row mt-5">
        <div class="d-flex gap-3">
            <input 
                class="btn btn-primary" 
                type="button" 
                value="Filtrar búsqueda"
                (click)="sendFilters()"
            />
            
            <input 
                class="btn btn-secondary" 
                type="button" 
                value="Limpiar filtros"
                (click)="clearFilters()"
            />
        </div>
    </div>
</div>
