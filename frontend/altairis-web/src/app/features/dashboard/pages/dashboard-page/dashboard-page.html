<h2>Estadísticas</h2>

<div class="container p-5">
    <div class="d-flex flex-wrap justify-content-start gap-4">
        <app-statistic-card-component 
            title="Reservaciones"
            icon="bi bi-calendar-check"
            [style]="'secondary'"
            [value]="statistics()?.roomTypes ?? 0"
            [statistics]="[
                {
                    value: statistics()?.pendingReservations ?? 0, 
                    label: 'pendientes', 
                    style: 'secondary'
                },
                {
                    value: statistics()?.confirmedReservations ?? 0, 
                    label: 'confirmadas', 
                    style: 'success'
                },
                {
                    value: statistics()?.cancelledReservations ?? 0, 
                    label: 'canceladas', 
                    style: 'danger'
                },
            ]"
        />
        
        <app-statistic-card-component 
            title="Hoteles"
            icon="bi bi-building"
            [style]="'secondary'"
            [value]="statistics()?.hotels ?? 0"
            [statistics]="[
                {
                    value: statistics()?.activeHotels ?? 0, 
                    label: 'activos', 
                    style: 'success'
                },
                {
                    value: statistics()?.inactiveHotels ?? 0, 
                    label: 'inactivos', 
                    style: 'danger'
                },
            ]"
        />
        
        <app-statistic-card-component 
            title="Habitaciones"
            icon="bi bi-house-gear"
            [style]="'secondary'"
            [value]="statistics()?.roomTypes ?? 0"
            [statistics]="[
                {
                    value: statistics()?.activeRoomTypes ?? 0, 
                    label: 'activos', 
                    style: 'success'
                },
                {
                    value: statistics()?.inactiveRoomTypes ?? 0, 
                    label: 'inactivos', 
                    style: 'danger'
                },
            ]"
        />
        
        <app-statistic-card-component
            title="Clientes registrados"
            icon="bi bi-people"
            [style]="'secondary'"
            [value]="statistics()?.customers ?? 0"
            [statistics]="[
                {
                    value: '', 
                    label: 'activos', 
                    style: 'success'
                }
            ]"
        />
    </div>
</div>
