<div class="d-flex flex-column justify-content-end align-items-start m-0 gap-1">
    @for (item of data(); track item) {
        <div class="d-flex justify-content-center align-items-center text-{{item.style}} gap-1">
            <div 
                class="d-flex justify-content-center align-items-center rounded-circle text-center bg-{{item.style}}-subtle" 
                style="min-width: 1em; max-width: 1em; max-height: 1em; min-height: 1em;"
            > ● </div>
            <span class="fw-semibold">
                {{ item.value }} {{ item.label }}
            </span>
        </div>
    }
</div>
