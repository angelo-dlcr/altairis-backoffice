<div 
    class="card shadow p-3 d-flex flex-column gap-3"
    style="min-width: 17rem; cursor: pointer;"
>

    <div class="d-flex justify-content-between align-items-center">
        <p class="card-text card-title {{`text-${style()}`}}">
            {{ title() }}
        </p>

        <i class="fs-2 me-1 {{icon()}} {{`text-${style()}`}} {{`bg-${style()}-subtle`}} rounded p-2"></i>
    </div>
    
    <div class="card-body d-flex justify-content-between align-items-end p-0">

        <div 
            class="p-0 m-0 font-monospace" 
            style="font-size: 4.5em; line-height: 80%;"
        >
            {{ value() }}
        </div>

        <app-statistic-text-component
            class="m-0"
            style="font-size: small;"
            [data]="statistics()"
        />

    </div>
</div>
