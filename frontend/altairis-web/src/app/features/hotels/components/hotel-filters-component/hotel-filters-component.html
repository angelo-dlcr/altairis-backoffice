
<div class="container mt-5 mb-4">
    <div class="row mb-3">
        <div class=" col-md-4">
            <label for="" class="form-label fw-semibold">Código / Nombre:</label>
            <input
                type="text"
                class="form-control"
                id="nameOrCode"
                [(ngModel)]="filters().nameOrCode"
                (ngModelChange)="updateFilterField('nameOrCode', $event)"
                placeholder=""
            />
            <!-- <small id="helpId" class="form-text text-body-secondary"
                >Help text</small
            > -->
        </div>
        <div class="col-md-4">
            <label for="" class="form-label fw-semibold">País:</label>
            <input
                type="text"
                class="form-control"
                id="country"
                [(ngModel)]="filters().country"
                (ngModelChange)="updateFilterField('country', $event)"
                placeholder=""
            />
            <!-- <small id="helpId" class="form-text text-body-secondary"
                >Help text</small
            > -->
        </div>
        <div class="col-md-4">
            <label for="" class="form-label fw-semibold">Ciudad:</label>
            <input
                type="text"
                class="form-control"
                id="city"
                [(ngModel)]="filters().city"
                (ngModelChange)="updateFilterField('city', $event)"
                placeholder=""
            />
            <!-- <small id="helpId" class="form-text text-body-secondary"
                >Help text</small
            > -->
        </div>
    </div>
    
    <div class="row mb-2">
        <div class="col-md-4">
            <label for="" class="form-label">Estado</label>
            <select
                class="form-select"
                id="isActive"
                [(ngModel)]="filters().isActive"
                (ngModelChange)="updateFilterField('isActive', $event)"
            >
                <option selected value="">Todos</option>
                <option value="true">Activos</option>
                <option value="false">Inactivos</option>
            </select>
        </div>
        
        <div class="col-md-4">
            <label for="" class="form-label fw-semibold">Fecha desde:</label>
            <input
                type="date"
                class="form-control"
                id="startDate"
                [(ngModel)]="filters().startDate"
                (ngModelChange)="updateFilterField('startDate', $event)"
                placeholder=""
            />
        </div>
        <div class="col-md-4">
            <label for="" class="form-label fw-semibold">Fecha hasta:</label>
            <input
                type="date"
                class="form-control"
                id="endDate"
                [(ngModel)]="filters().endDate"
                (ngModelChange)="updateFilterField('endDate', $event)"
                placeholder=""
            />
        </div>
    </div>

    <div class="row mt-5">
        <div class="d-flex gap-3">
            <input 
                class="btn btn-primary" 
                type="button" 
                value="Filtrar búsqueda"
                (click)="sendFilters()"
            />
            
            <input 
                class="btn btn-secondary" 
                type="button" 
                value="Limpiar filtros"
                (click)="clearFilters()"
            />
        </div>
    </div>
</div>
